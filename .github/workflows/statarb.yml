name: StatArb Bot (15min)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

# Évite que deux runs se chevauchent si un scan précédent traîne encore
# (ex: GitHub Actions en retard) — annule le plus vieux plutôt que de
# risquer deux scans concurrents sur le même compte Binance.
concurrency:
  group: statarb-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le scan StatArb
        working-directory: StatArb_ETH_15m/scripts
        env:
          API_KEY:       ${{ secrets.API_KEY }}
          API_SECRET:    ${{ secrets.API_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python live_bot.py
