name: Funding Carry Bot (8h)

on:
  schedule:
    # 00:02, 08:02, 16:02 UTC — 2 min après chaque paiement de funding pour
    # être sûr qu'il a bien été effectué côté Binance avant de checker.
    - cron: '2 0,8,16 * * *'
  workflow_dispatch: {}

concurrency:
  group: funding-bot
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le cycle Funding Carry
        working-directory: FundingCarry_Multi/scripts
        env:
          API_KEY:       ${{ secrets.API_KEY }}
          API_SECRET:    ${{ secrets.API_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python live_funding_bot.py
